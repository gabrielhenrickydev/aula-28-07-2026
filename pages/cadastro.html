<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Cadastro</h1>
        <form action="./pages/home.html" onsubmit="alert('usuario cadastrado')">
            
            <p>Email</p>
            <input type="email" placeholder="Digite seu email" required>

            <p>Senha</p>
            <input type="password" placeholder="Digite sua senha" required maxlength="150">

            <p>Nome</p>
            <input type="text" placeholder="Digite seu nome" required>

            <p>Sobrenome</p>
            <input type="text" placeholder="Digite seu sobrenome" required>

            <p>Data de nascimento</p>
            <input type="date" required>

            <p>Cor desejada</p>
            <input type="color"> 
            
            <button type="submit" aria-required="true">Cadastrar</button>
        </form>
</body>

</html>
